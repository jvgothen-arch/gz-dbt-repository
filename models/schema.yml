version: 2

sources:
  - name: gz_raw_data
    database: dynamic-sanctum-455919-n9
    schema: gz_raw_data
    loader: bigquery

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "one row per (orders_id, product_id)"
        columns:
          - name: date_date
          - name: orders_id
          - name: pdt_id    
        tests:
          - unique:
              column_name: "(orders_id ||'-' || pdt_id)"
         

      - name: product
        identifier: raw_gwz_product
        columns:
          - name: products_id
            tests:
              - unique
              - not_null

      - name: ship
        identifier: raw_gz_ship
        columns:
          - name: orders_id

      - name: bing
        identifier: raw_gz_bing
        description: "bing recherche et depense"
        columns:
          - name: date_date
       
         

      - name: facebook
        identifier: raw_gz_facebook
        columns:
          - name: date_date
         


      - name: adwords
        identifier: raw_gz_adwords
        columns:
          - name: date_date
           
      - name: criteo
        identifier: raw_gz_criteo
        columns:
          - name: date_date
          

      - name: campaigns
        identifier: int_campaigns

      - name: campaigns_day
        identifier: int_campaigns_day
      - name: finances camp
        identifier: finance_campaigns_days

      - name: finances month
        identifier: finance_campaigns_month